[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-open-orchestrator"
version = "0.1.0"
description = "Fail-closed, repair-capable orchestration loop reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AO Open Orchestrator contributors"}]
keywords = ["agents", "orchestration", "audit", "fail-closed", "state-machine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ao-state-writer = "ao_state_writer.cli:main"
ao-gpt-pro-desktop-bridge = "ao_state_writer.gpt_pro_desktop_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
