version = 1

# Bootstrap template. Rendered by scripts/bootstrap_project.py (or replace every @…@ by hand)
# into a target project's DIRECT_PROJECT_CONTRACT.toml. Action vocabulary and receipt-requirement
# fields are engine-enforced; do not rename them.
# 引导模板：由 scripts/bootstrap_project.py 渲染（或手动替换每个 @…@）为目标项目的
# DIRECT_PROJECT_CONTRACT.toml。action vocabulary 与 receipt 必填字段由引擎强制，勿改名。

[ao_clone_isolation]
# Absolute path of the active project root; the canonical ao-state-writer state.json lives here.
active_root = "@ACTIVE_ROOT@"

[owner_proxy]
project_id = "@PROJECT_ID@"

# Canonical per-project governance documents. Each value MUST be a bare filename (no path
# separators, no ".."): it is resolved relative to the project root. When this section or a key is
# omitted, the engine uses the default bare name shown below. An unsafe value fails loud.
[canonical]
todo_file = "@TODO_FILE@"
session_log_file = "@SESSION_LOG_FILE@"
master_plan_file = "@PLAN_FILE@"

[continuation_policy]
orchestrator_session = "@ORCHESTRATOR_SESSION@"
auto_spawn_actions = [
  "dispatch_next_slice_plan_mode",
  "codex_cc_review",
  "repair_active",
  "state_writer_closure",
  "major_closure_candidate",
]
gated_actions = ["escalated_review"]
non_executable_actions = ["repair_attempts_exhausted"]

# Command a dispatched worker uses to invoke this engine in its dispatch-obligation block. Defaults
# to the `ao-state-writer` console script shipped by this package (a normal `pip install`). Override
# only if you run the engine from a source checkout or mid-migration, e.g.
#   command = "PYTHONPATH=/abs/path/to/src python3 -m ao_state_writer.cli"
# Omitting the section/key keeps the brand-neutral default (identical rendered obligation).
[state_writer]
command = "@STATE_WRITER_CMD@"

[review_receipts]
escalated_review_receipt_requires = [
  "package_sha256",
  "external_review_submission_nonce",
  "external_review_receipt_sha256",
  "external_review_artifact_ref",
  "external_review_gate_proposal_id",
  "AO_CALLER_TYPE=escalated_review_actuator",
]
codex_cc_receipt_requires = [
  "codex_cc_transcript_sha256",
  "codex_cc_transcript_artifact_ref",
  "AO_CALLER_TYPE=codex_cc",
]

[transports]
# Descriptive flags for humans/profile tooling. The current Python core does
# not enforce these keys directly.
api_transport_allowed = false
external_adapter_required = true

[review_policy]
# Command the orchestrator invokes for an escalated-review obligation. The shipped
# reference actuator is brand-neutral: it verifies the package sha, shells out to YOUR
# reviewer (set AO_ESCALATED_REVIEW_ACTUATOR_SCRIPT to that command), then normalizes the
# output into a receipt. Do NOT point AO_ESCALATED_REVIEW_ACTUATOR_SCRIPT back at this
# module (that recurses). Replace with your own command if you prefer.
escalated_review_actuator_command = "python3.11 -m ao_state_writer.escalated_review_actuator"
